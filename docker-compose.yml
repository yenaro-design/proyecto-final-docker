
services:

  # Primera instancia del backend
  backend1:
    build: ./backend
    container_name: backend1
    environment:
      INSTANCE_ID: Backend-1
    restart: unless-stopped
    networks:
      - red-proyecto

  # Segunda instancia del backend
  backend2:
    build: ./backend
    container_name: backend2
    environment:
      INSTANCE_ID: Backend-2
    restart: unless-stopped
    networks:
      - red-proyecto

  # Tercera instancia del backend
  backend3:
    build: ./backend
    container_name: backend3
    environment:
      INSTANCE_ID: Backend-3
    restart: unless-stopped
    networks:
      - red-proyecto

  # Servidor Nginx como proxy inverso
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - red-proyecto

  # Exportador de métricas de Nginx
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - red-proyecto

  # Servidor Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx-exporter
      - cadvisor
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - red-proyecto

  # Monitor de recursos de los contenedores
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    networks:
      - red-proyecto

  # Visualización de métricas con Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - red-proyecto

# Red personalizada
networks:
  red-proyecto:
    driver: bridge

# Volúmenes persistentes
volumes:
  prometheus_data:
  grafana_data:
